# publisher.example.yaml — copy to config/publisher.yaml and fill in your values.
# config/publisher.yaml is git-ignored (per-tenant, never commit real values).
#
# Publisher-owned settings for manifest/payload publishing policy.
# Runtime credentials and operator identifiers come exclusively from the
# Bitwarden snapshot described by ml_app_settings_core/secret_catalog.py.

runtime:
  workspace_root: "./workspace"
  http:
    # Resilience settings consumed only from this canonical snapshot path.
    timeout: 30
    max_retries: 3
    backoff_factor: 0.5
    rate_limit:
      enabled: true
      requests_per_second: 2.0
      burst: 5

seller:
  listing:
    allowed_types: []
    default_type: ""

  pricing:
    min_price: null
    max_price: null

  categories:
    blocked: []
    overrides: {}

  batch:
    human_review_required: true
    publish_inactive: true

